# Default security headers, baked into the image. docker-entrypoint.d/40-runtime-config.sh replaces
# this file at container start with the same policy plus the configured Auth0 tenant in
# connect-src; this copy only applies if that script never ran.
#
# Included in EVERY location of default.conf: nginx drops server-level add_header directives in any
# location that declares its own, so they cannot live at server level.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
