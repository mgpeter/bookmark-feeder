server {
    # 8000, not nginx's default 80: Aspire's AddViteApp fixes the web resource's port at 8000, so
    # the published compose exposes 8000 and points the gateway at http://web:8000. Listening on
    # 80 made every page load a 502 from the gateway.
    listen 8000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Written at container start from the environment, so it must never be cached. Without this,
    # rotating an Auth0 tenant appears to do nothing: the browser keeps serving the first config.js
    # it ever saw.
    location = /config.js {
        include /etc/nginx/bookmarkfeeder/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Vite's content-hashed bundles: a given name never changes, so cache it for good. A miss is a
    # real 404 - falling back to index.html would hand an old cached page HTML where it expects a
    # script, which fails as a blank page after every upgrade.
    location /assets/ {
        include /etc/nginx/bookmarkfeeder/security-headers.conf;
        # Not "always": a 404 must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static files, then SPA fallback so client-side routes resolve to index.html. no-cache (=
    # always revalidate) so a new release's index.html, which names the new bundles, is picked up.
    location / {
        include /etc/nginx/bookmarkfeeder/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
