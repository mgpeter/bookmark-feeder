name: "bookmark-feeder"
services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/aspire-dashboard:9.5.2"
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:18888:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "unless-stopped"
  postgres:
    image: "docker.io/library/postgres:18.3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.nas.template)}"
    expose:
      - "5432"
    volumes:
      - type: "bind"
        target: "/var/lib/postgresql"
        source: "${POSTGRES_DATA_PATH:-./data/postgres}"
        read_only: false
    networks:
      - "aspire"
    restart: "unless-stopped"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U postgres -d bookmarkfeeder"
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "30s"
  webapi:
    image: "${WEBAPI_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${WEBAPI_PORT}"
      ConnectionStrings__bookmarkfeeder: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=bookmarkfeeder"
      BOOKMARKFEEDER_HOST: "postgres"
      BOOKMARKFEEDER_PORT: "5432"
      BOOKMARKFEEDER_USERNAME: "postgres"
      BOOKMARKFEEDER_PASSWORD: "${POSTGRES_PASSWORD}"
      BOOKMARKFEEDER_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/bookmarkfeeder"
      BOOKMARKFEEDER_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/bookmarkfeeder"
      BOOKMARKFEEDER_DATABASENAME: "bookmarkfeeder"
      Auth0__Domain: "${AUTH0_DOMAIN}"
      Auth0__Audience: "${AUTH0_AUDIENCE}"
      Auth0__ClientId: "${AUTH0_CLIENT_ID}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "webapi"
      Auth0__LegacyOwner: "${AUTH0_LEGACY_OWNER:-}"
    expose:
      - "${WEBAPI_PORT}"
    depends_on:
      postgres:
        condition: "service_healthy"
    networks:
      - "aspire"
    restart: "unless-stopped"
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/$${HTTP_PORTS} && printf 'GET /alive HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: "30s"
      timeout: "5s"
      retries: 3
      start_period: "60s"
  web:
    image: "${WEB_IMAGE}"
    environment:
      NODE_ENV: "production"
      PORT: "8000"
      VITE_AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      VITE_AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID}"
      VITE_AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "web"
    expose:
      - "8000"
    networks:
      - "aspire"
    restart: "unless-stopped"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O - http://127.0.0.1:8000/ > /dev/null || exit 1"
      interval: "30s"
      timeout: "5s"
      retries: 3
      start_period: "10s"
  gateway:
    image: "${GATEWAY_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${GATEWAY_PORT}"
      WEBAPI_HTTP: "http://webapi:${WEBAPI_PORT}"
      services__webapi__http__0: "http://webapi:${WEBAPI_PORT}"
      WEBAPI_HTTPS: "https://webapi:${WEBAPI_PORT}"
      WEB_HTTP: "http://web:8000"
      services__web__http__0: "http://web:8000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "gateway"
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      webapi:
        condition: "service_healthy"
      web:
        condition: "service_healthy"
    networks:
      - "aspire"
    restart: "unless-stopped"
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/$${HTTP_PORTS} && printf 'GET /alive HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: "30s"
      timeout: "5s"
      retries: 3
      start_period: "60s"
networks:
  aspire:
    driver: "bridge"
